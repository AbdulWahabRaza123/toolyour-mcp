name: CI

# Use when toolyour-mcp is the GitHub repository root (or Railway-linked package repo).
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    name: Build + eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: CI suite
        run: npm run ci
